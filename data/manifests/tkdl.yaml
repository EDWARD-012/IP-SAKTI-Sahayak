notes: >
  TKDL is a defensive database documenting codified Indian traditional
  knowledge (Ayurveda, Siddha, Unani, Yoga) to prevent wrongful patents
  (bio-piracy). Access to the full TKDL database is restricted (access
  agreements with patent offices). Only use PUBLIC descriptive material
  (about pages, published papers, access-agreement summaries) — NOT the
  proprietary formulation records. reuse_basis=verify-and-record: confirm
  the licence of each captured page before ingestion.
