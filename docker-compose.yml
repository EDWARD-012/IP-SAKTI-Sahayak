version: "3.9"

# IP-SAKTI Sahayak — local Docker stack
# Railway production: Django only + tunneled laptop Ollama (see docs/DEPLOY_OLLAMA.md).

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - DEBUG=False
      - DEMO_MODE=${DEMO_MODE:-True}
      - SECRET_KEY=docker-dev-secret-change-in-prod
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # Default: host Ollama. With compose profile "ollama", use http://ollama:11434
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}
      - AUDIT_HMAC_KEY=docker-dev-audit-key-change-in-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional local Ollama (CPU). Start with:
  #   docker compose --profile ollama up -d
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:

# After starting the ollama profile, pull the model once:
#   docker compose --profile ollama exec ollama ollama pull qwen2.5:3b-instruct-q4_K_M
# Then:
#   set OLLAMA_BASE_URL=http://ollama:11434
#   set DEMO_MODE=False
#   docker compose up -d --build web
