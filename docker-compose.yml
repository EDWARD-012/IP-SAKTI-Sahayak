version: "3.9"

# IP-SAKTI Sahayak — Docker Compose (local development)
# Note: Ollama runs on the HOST machine, not in a container (GPU passthrough is complex).
# The app container connects to host Ollama via host.docker.internal.

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - DEBUG=False
      - DEMO_MODE=True
      - SECRET_KEY=docker-dev-secret-change-in-prod
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # Point to host Ollama (if running on host)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - AUDIT_HMAC_KEY=docker-dev-audit-key-change-in-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# To run live RAG (not demo mode):
#   1. docker-compose exec web python manage.py build_corpus_version --version 1
#   2. docker-compose exec web python manage.py activate_corpus_version --version 1
#   3. Set DEMO_MODE=False in environment
