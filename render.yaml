services:
  - type: web
    name: ip-sakti-sahayak
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn ip_sakti.wsgi:application --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: your-app.onrender.com
      - key: AUDIT_HMAC_KEY
        generateValue: true
